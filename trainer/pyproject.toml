[project]
name = "hitcheck-trainer"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "pillow>=10.4",
    "numpy>=1.26",
]

[project.optional-dependencies]
ml = [
    "torch>=2.4",
    "transformers>=4.44",
    "hnswlib>=0.8",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hitcheck_trainer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
