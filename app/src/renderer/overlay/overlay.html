<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html, body {
        margin: 0; padding: 0; height: 100%;
        background: transparent; overflow: hidden;
        pointer-events: none;
      }
      #box {
        position: absolute; inset: 12px;
        border: 3px solid #35d07f;
        border-radius: 6px;
        box-shadow: 0 0 0 1px rgba(0,0,0,.6), 0 0 18px rgba(53,208,127,.45);
      }
      #label {
        position: absolute; top: -28px; left: 0;
        font: 600 13px/1 system-ui, sans-serif;
        color: #eafff4; background: rgba(6,26,18,.85);
        padding: 6px 9px; border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <div id="box"><div id="label">HitCheck — overlay alive</div></div>
  </body>
</html>
